<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - mediCare</title>
<link rel="stylesheet" href="Style.css">
</head>
<body>
<div class="navbar">
  <div class="logo">🩺 mediCare</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <span class="dark-toggle" onclick="toggleDarkMode()">🌓</span>
  </nav>
</div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="sub">Register as a patient or a certified doctor</p>
    <div id="error-box" class="alert alert-error" style="display:none;"></div>

    <div class="role-toggle">
      <button type="button" id="role-patient" class="active" onclick="selectRole('patient')">I'm a Patient</button>
      <button type="button" id="role-doctor" onclick="selectRole('doctor')">I'm a Doctor</button>
    </div>

    <form onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="reg-phone">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" required minlength="6">
      </div>
      <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>
    <p style="margin-top:16px; text-align:center; font-size:14px;">
      Already have an account? <a href="login.html" style="color:#0f766e;">Login</a>
    </p>
  </div>
</div>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
  function handleSubmit(e){
    handleRegister(e)
  }
</script>
</body>
</html>
