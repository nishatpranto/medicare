<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - mediCare</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="navbar">
  <div class="logo">🩺 mediCare</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="register.html">Register</a>
    <span class="dark-toggle" onclick="toggleDarkMode()">🌓</span>
  </nav>
</div>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Welcome back</h2>
    <p class="sub">Login to your mediCare account</p>
    <div id="error-box" class="alert alert-error" style="display:none;"></div>
    <form onsubmit="loginSubmit(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>
    <p style="margin-top:16px; text-align:center; font-size:14px;">
      Don't have an account? <a href="register.html" style="color:#0f766e;">Register</a>
    </p>
  </div>
</div>

<script src="../api.js"></script>
<script src="../auth.js"></script>
<script>
  function loginSubmit(e){
    handleLogin(e)
  }
</script>
</body>
</html>
